<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Greece with Mom: trip plan and savings</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F5F8FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#081421" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Greece">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&family=GFS+Didot&display=swap" rel="stylesheet">
<style id="app-css">
:root{
  --bg:#F5F8FB; --surface:#FFFFFF; --marble:#E2E8F0; --marble-2:#C9D3E0; --flute:rgba(14,42,71,.07); --flute-fill:rgba(255,255,255,.17);
  --ink:#0E2A47; --muted:#56687E; --line:#DCE3EC; --sea:#1F5FBF; --sea-soft:#E4EDFA; --bloom:#B4236B; --bloom-soft:#FBE7F0; --on-sea:#FFFFFF;
  --display:"GFS Didot","Didot","Bodoni MT","Times New Roman",serif;
  --text:"Commissioner","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --shaft-h:250px; --shaft-w:52px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#081421; --surface:#0E2033; --marble:#1D344E; --marble-2:#2A4563; --flute:rgba(255,255,255,.05); --flute-fill:rgba(8,20,33,.2);
    --ink:#E9F0F8; --muted:#9DB0C6; --line:#1D3550; --sea:#5C9DFF; --sea-soft:#13304F; --bloom:#FF7DB1; --bloom-soft:#3A1830; --on-sea:#06121F;
  }
}
:root[data-theme="dark"]{
  --bg:#081421; --surface:#0E2033; --marble:#1D344E; --marble-2:#2A4563; --flute:rgba(255,255,255,.05); --flute-fill:rgba(8,20,33,.2);
  --ink:#E9F0F8; --muted:#9DB0C6; --line:#1D3550; --sea:#5C9DFF; --sea-soft:#13304F; --bloom:#FF7DB1; --bloom-soft:#3A1830; --on-sea:#06121F;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.5;font-variant-numeric:lining-nums}
#app{max-width:680px;margin:0 auto;padding:18px 16px 108px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px;border-radius:4px}

/* the temple: three columns fill as the savings grow */
.temple{max-width:500px;margin:6px auto 0}
.pediment{position:relative;height:60px}
.pediment svg{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;display:block}
.pediment polygon{fill:var(--surface);stroke:var(--marble-2);stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.pediment .days{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.frieze{background:var(--surface);border:solid var(--marble-2);border-width:1.5px 0;text-align:center;font-family:var(--display);font-size:15px;letter-spacing:.32em;text-transform:uppercase;padding:9px 0 8px .32em}
.colonnade{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:0 5%}
.col{display:flex;flex-direction:column;align-items:center}
.abacus{width:calc(var(--shaft-w) + 20px);height:7px;background:var(--marble-2)}
.echinus{width:calc(var(--shaft-w) + 9px);height:6px;background:var(--marble);border-radius:0 0 9px 9px}
.shaft{position:relative;width:var(--shaft-w);height:var(--shaft-h);overflow:hidden;background-color:var(--marble);background-image:repeating-linear-gradient(90deg,transparent 0 7px,var(--flute) 7px 8px)}
.fill{position:absolute;left:0;right:0;bottom:0;background-color:var(--sea);background-image:repeating-linear-gradient(90deg,transparent 0 7px,var(--flute-fill) 7px 8px);transition:height .9s cubic-bezier(.2,.7,.2,1)}
.todayline{position:absolute;left:0;right:0;bottom:0;height:var(--shaft-h);pointer-events:none}
.todayline i{position:absolute;left:0;right:0;height:2px;margin-bottom:-1px;background:var(--bloom);transition:bottom .9s cubic-bezier(.2,.7,.2,1)}
.todayline b{position:absolute;left:0;bottom:4px;font:600 11px/1 var(--text);font-style:normal;color:var(--bloom);background:var(--bg);padding:2px 5px 2px 0;border-radius:3px}
.todayline b.below{bottom:auto;top:6px}
.steps i{display:block;height:7px;margin:0 auto}
.steps i:nth-child(1){width:93%;background:var(--marble-2)}
.steps i:nth-child(2){width:96.5%;background:var(--marble)}
.steps i:nth-child(3){width:100%;background:var(--marble-2)}

.people{max-width:500px;margin:14px auto 0;display:grid;grid-template-columns:repeat(3,1fr);padding:0 5%;text-align:center}
.person h2{margin:0;font:600 15px/1.3 var(--text)}
.person .saved{font-size:25px;font-weight:650;line-height:1.15;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:2px}
.person .of{font-size:13px;color:var(--muted);margin-bottom:7px}
.person .monthly{font-size:13px;color:var(--muted);margin-top:7px}
.person .catch{font-size:12px;color:var(--bloom);line-height:1.3;margin-top:2px}
.chip{display:inline-block;font-size:12px;font-weight:600;line-height:1;padding:5px 8px;border-radius:999px;white-space:nowrap}
.chip.good{color:var(--sea);background:var(--sea-soft)}
.chip.late{color:var(--bloom);background:var(--bloom-soft)}
.chip.quiet{color:var(--muted);background:var(--marble)}
.legend{max-width:500px;margin:16px auto 0;font-size:13px;color:var(--muted);text-align:center}
.legend .swatch{display:inline-block;width:18px;height:2px;background:var(--bloom);vertical-align:middle;margin-right:8px}

.together{margin:26px 0 0;padding:18px 0 0;border-top:1px solid var(--line)}
.together p{margin:0;font-size:18px;line-height:1.5;max-width:34em}
.together .nextdue{margin-top:10px;font-size:15px;color:var(--muted)}
.together strong,.nextdue strong{font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums}
h2.sec{font-family:var(--display);font-weight:400;font-size:25px;line-height:1.2;margin:38px 0 12px}

.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:5px;top:12px;bottom:12px;width:1px;background:var(--marble-2)}
.timeline li{position:relative;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;padding:9px 0 11px 26px}
.timeline li::before{content:"";position:absolute;left:0;top:13px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--marble-2)}
.timeline li.next::before{border-color:var(--sea);background:var(--sea)}
.timeline li.bought::before,.timeline li.covered::before{border-color:var(--sea)}
.timeline li.short::before{border-color:var(--bloom)}
.timeline .when{display:block;font-size:13px;color:var(--muted)}
.timeline li.next .when{color:var(--sea);font-weight:600}
.timeline .amt{padding-top:19px}
.timeline .what strong{display:block;font-weight:600;font-size:15.5px;line-height:1.35}
.timeline .note{display:block;font-size:13px;color:var(--muted);line-height:1.4}
.timeline li.short .note{color:var(--bloom)}
.timeline li.bought .what strong,.timeline li.bought .amt{color:var(--muted);text-decoration:line-through}
.timeline .amt,.ledger .amt{font-variant-numeric:tabular-nums;font-weight:600;font-size:15.5px;text-align:right}

.ledger{list-style:none;margin:0;padding:0}
.ledger li{display:grid;grid-template-columns:104px 1fr auto auto;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.ledger .when{font-size:13.5px;color:var(--muted)}
.ledger .who{font-weight:500}
.ledger .note{display:block;font-size:13px;font-weight:400;color:var(--muted)}
.empty,.fine,.hint{color:var(--muted);font-size:14px}
.fine{margin:34px 0 0;font-size:13px;max-width:60ch}
.link{background:none;border:0;padding:4px 0;color:var(--sea);font-size:13.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link[data-armed]{color:var(--bloom);font-weight:600}

.btn{appearance:none;border:1.5px solid var(--marble-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;line-height:1.1;padding:14px 12px;border-radius:12px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--sea);border-color:var(--sea);color:var(--on-sea)}
.btn.small{font-size:13.5px;padding:9px 12px;border-radius:9px}
.btn:active{transform:translateY(1px)}
.saving .btn,.saving .link{opacity:.55;pointer-events:none}
.actionbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.actionbar .btn{flex:1;max-width:320px}
.trybar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--bloom-soft);color:var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.trybar span:last-child{display:flex;gap:8px}

/* sheets */
dialog{border:0;padding:0;margin:auto auto 0;width:100%;max-width:100%;max-height:calc(100vh - 20px);max-height:calc(100dvh - env(safe-area-inset-top,0px) - 20px);background:var(--surface);color:var(--ink);border-radius:20px 20px 0 0;overflow:hidden;overflow:clip}
dialog::backdrop{background:rgba(6,18,31,.5)}
dialog[open]{display:flex}
.sheet{display:flex;flex-direction:column;min-height:0;width:100%;padding:20px 18px 0}
.sheet h2{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.2;margin:0}
.sheet .sub{margin:4px 0 12px;color:var(--muted);font-size:14px}
.sheet h3{font:600 13.5px/1.3 var(--text);color:var(--muted);margin:24px 0 6px}
.sheetbody>h3:first-child{margin-top:16px}
.sheetbody{overflow:auto;min-height:0;flex:1 1 auto;margin-top:12px;border-top:1px solid var(--line);padding-bottom:4px;margin-left:-18px;margin-right:-18px;padding-left:18px;padding-right:18px;overscroll-behavior:contain}
.sheetbar{display:flex;gap:10px;margin-top:14px;padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.sheetbar .btn{flex:1}
.livesum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--bg);border-radius:12px;padding:10px 8px;text-align:center}
.livesum span{display:block;font-size:12px;color:var(--muted)}
.livesum strong{display:block;font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.25}
.livesum small{display:block;font-size:11px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.field{display:block;min-width:0}
.field>span:first-child{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=date],input[inputmode],input:not([type]),select{width:100%;min-width:0;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;line-height:1.2;font-variant-numeric:tabular-nums}
input:focus,select:focus{outline:2px solid var(--sea);outline-offset:0;border-color:transparent}
.moneyin{position:relative;display:block}
.moneyin::before{content:"$";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.moneyin input{padding-left:24px}
.moneyin.euro::before{content:"\20AC"}
.hint{margin:8px 0 0;font-size:13px}
.hint.reset{margin-top:22px}
.hint.flights{margin:0 0 10px}
.switch{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:44px;height:26px;border-radius:999px;background:var(--marble-2);position:relative;transition:background .15s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+.track{background:var(--sea)}
.switch input:checked+.track::after{transform:translateX(18px)}
.switch input:focus-visible+.track{outline:2px solid var(--sea);outline-offset:2px}
.switch .txt span{display:block;font-size:15px;line-height:1.35}
.switch .txt small{display:block;font-size:12.5px;color:var(--muted);line-height:1.35}
.switch em{font-style:normal;font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.buy{padding:10px 0;border-bottom:1px solid var(--line);display:grid;gap:8px}
.buyrow{display:grid;grid-template-columns:minmax(158px,1.3fr) 1fr auto;gap:8px;align-items:center}
.buyrow.who{grid-template-columns:1fr auto auto;gap:12px}
.buy .auto{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;padding-left:4px}
.tick{display:flex;gap:6px;align-items:center;font-size:13.5px;white-space:nowrap}
.tick input{width:18px;height:18px;accent-color:var(--sea)}
.buy+.btn{margin-top:12px}
.payrow{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;margin-top:10px}
.payrow label{font-weight:600}
#pay-date{margin-bottom:4px}
.sheet .field{margin-top:12px}
.grid2 .field{margin-top:0}
.err{color:var(--bloom);font-size:14px;margin:8px 0 0;min-height:0}
.err:empty{display:none}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--bg);font-size:14.5px;line-height:1.35;padding:11px 16px;border-radius:12px;max-width:min(92vw,460px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:5;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (min-width:640px){
  :root{--shaft-h:310px;--shaft-w:64px}
  #app{padding-top:34px}
  .frieze{font-size:18px;padding-top:11px;padding-bottom:10px}
  .pediment{height:72px}.pediment .days{font-size:14px;bottom:11px}
  .person h2{font-size:17px}.person .saved{font-size:32px}.person .of,.person .monthly{font-size:14px}
  .together p{font-size:20px}
  dialog{margin:auto;max-width:600px;border-radius:20px;max-height:min(88vh,860px);max-height:min(88dvh,860px)}
  .sheet{padding:26px 26px 0}.sheetbody{margin-left:-26px;margin-right:-26px;padding-left:26px;padding-right:26px}
}
@media (max-width:359px){.person .saved{font-size:21px}.chip{font-size:11.5px;padding:5px 7px}.livesum strong{font-size:15px}}
@media (prefers-reduced-motion:reduce){.fill,.todayline i,.switch .track,.switch .track::after,#toast{transition:none}}

/* sections: Savings, The trip, Budget, To do */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;display:flex;justify-content:center;gap:2px;margin:-18px -16px 14px;padding:4px 8px 0;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tabs button{appearance:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:12px 12px 10px;font-weight:600;font-size:14.5px;line-height:1;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-current=page]{color:var(--ink);border-bottom-color:var(--ink)}
.view p{margin:0 0 12px;max-width:64ch;font-size:15.5px;line-height:1.55}
.view-savings p{max-width:none}
h2.sec.first{margin-top:14px}
.lead{font-size:18px!important;line-height:1.5!important}
.lead strong{font-weight:650}
.plain{margin:0;padding:0 0 0 18px;max-width:64ch}
.plain li{margin:0 0 9px;font-size:15.5px;line-height:1.55}
.plain b,.day b{font-weight:650}
.base{margin:26px 0 8px}
.base h3{font:600 18px/1.3 var(--text);margin:0}
.base p{margin:3px 0 0;color:var(--muted);font-size:14.5px}
details.day{border-top:1px solid var(--line)}
details.day:last-of-type{border-bottom:1px solid var(--line)}
details.day summary{list-style:none;display:grid;grid-template-columns:92px 1fr 14px;gap:10px;align-items:center;padding:13px 2px 13px 0;cursor:pointer}
details.day summary::-webkit-details-marker{display:none}
.day .n{font-size:12.5px;color:var(--muted);line-height:1.3}
.day .n b{display:block;color:var(--ink);font-size:14.5px;font-weight:600}
.day .t{font-weight:600;font-size:16px;line-height:1.3}
.day .chev{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s}
details[open] .chev{transform:rotate(-135deg) translate(-2px,-2px)}
.day .body{padding:2px 0 8px}
.day .body p{margin:0 0 11px}
.day .mom{border-left:3px solid var(--bloom);padding:1px 0 1px 12px}
.day .mom b{color:var(--bloom)}
.scroll{overflow-x:auto;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:9px 0 9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:normal;padding-left:0}
.tbl thead th{font-weight:600;color:var(--muted);font-size:12.5px}
.tbl tr.total td{font-weight:650;border-top:1.5px solid var(--ink)}
.tbl tr.sub td{color:var(--muted);border-bottom:0}
h3.sub{font:600 15px/1.3 var(--text);margin:24px 0 4px}
.items{list-style:none;margin:0 0 6px;padding:0}
.items li{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.4}
.items li span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;font-weight:500}
.view .hint{font-size:13.5px;margin:6px 0 8px}
.todo{list-style:none;margin:0;padding:0}
.todo li{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:13px 0;border-bottom:1px solid var(--line)}
.todo input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--sea)}
.todo label{cursor:pointer}
.todo .when{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.todo li.now .when{color:var(--sea);font-weight:600}
.todo li.late .when{color:var(--bloom);font-weight:600}
.todo .what{display:block;font-size:15.5px;line-height:1.5;max-width:62ch}
.todo li.done .what{color:var(--muted);text-decoration:line-through}
@media (min-width:640px){.tabs{margin-top:-34px;margin-bottom:22px}.tabs button{font-size:15.5px;padding:15px 18px 13px}details.day summary{grid-template-columns:120px 1fr 14px}.day .body{padding-left:130px}}
@media (max-width:359px){.tabs button{padding-left:8px;padding-right:8px;font-size:13.5px}}
@media (prefers-reduced-motion:reduce){.day .chev{transition:none}}
@media (max-width:479px){.tbl{font-size:13px}.tbl th,.tbl td{padding-left:7px}.tbl thead th{font-size:12px}}
.edbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--sea-soft);color:var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.edbar span:last-child{display:flex;flex-wrap:wrap;gap:8px}

.expected{font-size:11.5px;color:var(--muted);margin-top:4px}
.funds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0 0;padding:14px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:center}
.funds span{display:block;font-size:12px;color:var(--muted)}
.funds strong{display:block;font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.view a{color:var(--sea);text-underline-offset:3px}
.sheetbody details{margin-top:16px}.sheetbody summary{cursor:pointer;padding:8px 0}
.timeline li.unrecorded .note{color:var(--bloom)}

        '<div class="expected">By today: ' + money(p.expected) + "</div></div>";
    });
    h += "</div>";
    h += '<p class="legend"><span class="swatch"></span>The line marks the group’s expected percentage today. Each person’s target is shown below their column.</p>';
    h += '<section class="together"><p>Together we have saved <strong>' + money(D.saved) + "</strong> of <strong>" + money(D.goal) + "</strong>. " +
      (D.deposits.due === 0 ? "Saving starts <strong>" + esc(fmtDay(D.deposits.first)) + "</strong>, with " + D.deposits.n + " monthly deposits."
        : "By today the plan calls for <strong>" + money(D.expected) + "</strong>.") + "</p>";
    var owing = D.payers.filter(function (p) { return p.now > 0; }), byDate = {}, isoToday = toISO(today());
    owing.forEach(function (p) { var k = p.nextDue ? toISO(p.nextDue) : ""; (byDate[k] = byDate[k] || []).push(p); });
    Object.keys(byDate).sort().forEach(function (k) {
      var who = byDate[k].map(function (p) { return esc(p.id) + " " + money(p.now); }).join(", ");
      h += '<p class="nextdue">' + (k === "" ? "The last deposit date has passed. Still owed: " : k === isoToday ? "Due <strong>today</strong>: " : "Next deposits are due <strong>" + esc(fmtDay(parseISO(k))) + "</strong>: ") + who + ".</p>";
    });
    if (owing.some(function (p) { return p.changed && p.nextDue; })) h += '<p class="nextdue">Amounts rise after a missed or short payment and fall after an extra one, so everyone still finishes on time.</p>';
    h += "</section>";
    h += '<div class="funds" aria-label="Trip fund balances"><div><span>Contributed</span><strong>'+moneyExact(D.saved)+'</strong></div><div><span>Spent</span><strong>'+moneyExact(D.spent)+'</strong></div><div><span>Cash held</span><strong>'+moneyExact(D.cash)+'</strong></div></div>';
    if(D.cash<-.005)h+='<p class="err">Spending exceeds recorded contributions. Reconcile the bank balance and any missing contributions.</p>';
    if(D.dateIssue)h+='<p class="err">'+esc(D.dateIssue)+'</p>';
    h += '<section><h2 class="sec">What we buy, and when</h2><ol class="timeline">';
    D.purchases.forEach(function (x) {
      var note=x.state==='bought'?'Paid: '+moneyExact(x.paid):x.state==='unrecorded'?'Previously marked bought. Record the actual expense to reconcile cash.':x.state==='covered'?'Remaining amount is covered by recorded cash.':x.state==='scheduled'?'Covered if the scheduled future deposits are made.':'Projected shortfall of '+money(x.shortBy)+' by this deadline. Check contributions and dates.';
      if(x.paid>0&&x.remaining>0)note=moneyExact(x.paid)+' paid; '+moneyExact(x.remaining)+' remaining. '+note;
      if(x.remaining>0.005&&x.state!=='unrecorded'&&toISO(x.date)<toISO(today()))note='This date has passed. If it has been bought, Chris records the expense under Trip spending; if not, move the date. '+note;
      h += '<li class="' + x.state + (x.next ? " next" : "") + '"><span class="what"><span class="when">' + esc(fmtMonth(x.date)) + (x.next ? ", next up" : "") + "</span><strong>" + esc(x.name) +
        '</strong><span class="note">' + esc(note) + '</span></span><span class="amt">' + money(x.amount) + "</span></li>";
    });
    h += "</ol></section>";
    var pays = state.payments.slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    h += '<section><h2 class="sec">Contributions received</h2>';
    if (!pays.length) h += '<p class="empty">No contributions yet. The first deposits are due ' + esc(fmtDay(D.deposits.first)) + ".</p>";
    else {
      h += '<ul class="ledger">';
      (showAll ? pays : pays.slice(0, 9)).forEach(function (p) {
        h += "<li><span class=\"when\">" + esc(fmtDay(parseISO(p.date))) + '</span><span class="who">' + esc(p.who) + (p.note ? '<span class="note">' + esc(p.note) + "</span>" : "") +
          '</span><span class="amt">' + moneyExact(p.amount) + "</span>" + (canSave ? '<button class="link" data-act="remove-pay" data-id="' + esc(p.id) + '">Remove</button>' : "") + "</li>";
      });
      h += "</ul>";
      if (pays.length > 9) h += '<button class="link" data-act="toggle-all">' + (showAll ? "Show fewer" : "Show all " + pays.length + " payments") + "</button>";

  }

  /* ----- the trip: every day, written for the choices that are switched on ----- */
  function itinerary(s) {
    var d = s.dials, skipS = d.skipSantorini, days = [];
    var audio = "Before the trip, everyone downloads the free Rick Steves Audio Europe app; its Acropolis tour runs about an hour and stands in for a guide.";
    days.push({ n: 1, base: "Athens", title: "Arrive and exhale", body: [
      "Two taxis from the airport to the " + (s.apartments ? "apartments" : "hotel") + " at the flat rate, about 45 minutes. The metro costs less and is step-free, but after an overnight flight with luggage the taxis are worth it for Mom. The Chicago nonstop lands in the morning, so the rooms may not be ready: drop the bags, have a long lunch nearby, and nap once you can get in.",
      "Early evening: a slow walk through the pedestrian lanes of Plaka and dinner at a simple taverna. The floodlit Parthenon is free to admire from the pedestrian street below it, Dionysiou Areopagitou. Early to bed."],
      mom: "Request airport wheelchair assistance when the flights are booked. It is free, and it turns long terminal walks and passport lines into a short ride. Before booking any lodging, confirm the way in and the bathroom." });
    days.push({ n: 2, base: "Athens", title: "The Acropolis and its museum", body: [
      "<b>8:00 am timed entry</b>, the coolest and quietest slot of the day. " + (d.guides ? "A licensed guide meets the family at the gate and stays through the museum." : audio) + " About two hours on the rock: the Propylaea, the Parthenon, the Erechtheion and its Caryatids, and the view over the whole city.",
      "Walk down to the air-conditioned <b>Acropolis Museum</b>, then a cheap lunch in Makrygianni or Koukaki, where gyros and souvlaki cost a few euros. Home by 1:30 for a long rest through the heat. If the morning took everything, the museum moves to Day 3.",
      "Evening: the whitewashed lanes of Anafiotika and Plaka on foot, with the app's free Athens City Walk for anyone who wants it, and dinner at a garden taverna."],
      mom: "The way up is a moderate uphill path with worn marble steps near the top, and the marble is slippery, so shoes with real grip matter. The site has an elevator on the north slope for visitors with reduced mobility. Confirm eligibility and that it is running directly with the site; it stops in strong winds and extreme weather. The museum and its terrace view are a worthy alternative if the hill is too much." });
    if (d.skipDelphi) days.push({ n: 3, base: "Athens", title: "Athens at an easy pace", body: [
      "No alarm. The changing of the guard at Syntagma Square, the shade of the National Garden next door, the Central Market, and the Monastiraki flea market are all free. Long lunch, long rest, and an evening stroll.",
      "Optional and not in the budget: the air-conditioned <b>National Archaeological Museum</b> (with a free audio tour in the same app) or the Ancient Agora. Anyone who wants Delphi can go on their own by intercity coach, about " + EUR + "40 round trip plus the " + EUR + "20 ticket, while everyone else rests. Switching Delphi on for the whole family " + effectWords(-delta("dial.skipDelphi")) + "."],
      mom: "Everything today is flat and close to a cafe chair. Taxis between stops cost a few euros. This is her recovery day before the ferry." });
    else days.push({ n: 3, base: "Athens", title: "Delphi, the big day trip", body: [
      d.privateDrivers ? "Leave at 7:30 am by <b>private minibus</b>, about 2.5 hours each way across the plains of Boeotia and up the flank of Mount Parnassus, arriving before the heat." + (d.guides ? " A licensed guide meets the family at the site." : "")
        : "By <b>intercity coach</b> from the Liosion Street terminal, about 2.5 to 3 hours each way for " + EUR + "15 to " + EUR + "20 a seat. Buy tickets ahead in summer, because the coaches fill, and take two taxis to the terminal. Take the first departure of the morning." + (d.guides ? " A licensed guide meets the family at the site." : ""),
      d.privateDrivers ? "Walk the <b>Sacred Way</b> first, while it is cool: the Athenian Treasury, then the <b>Temple of Apollo</b>, where the oracle spoke. Then the compact, air-conditioned <b>museum</b> and its bronze Charioteer, and a late lunch with a valley view. Back in Athens by about 6:30 pm."
        : "The coach arrives late in the morning, so start in the compact, air-conditioned <b>museum</b> and its bronze Charioteer, have lunch with a valley view in Delphi village, and walk the <b>Sacred Way</b> afterward: the Athenian Treasury, then the <b>Temple of Apollo</b>, where the oracle spoke. Back in Athens in the evening."],
      mom: "The Sacred Way is a steady uphill path on uneven stone" + (d.privateDrivers ? "." : ", and by coach the visit falls in the warmest hours.") + " She should go only as far as the Temple of Apollo, or enjoy the museum and a shaded cafe while the others climb. If this day sounds like too much, switch Delphi off and she gets a rest day instead." });
    days.push({ n: 4, base: "Naxos", title: "To the islands", body: [
      d.flyToNaxos ? "An unhurried morning, then two taxis to the airport and a <b>40-minute flight to Naxos</b>. Tip: leave the big suitcases with the Athens hotel where you spend the last night, and take carry-on-size bags to the islands."
        : "An early start: two taxis to Piraeus for the <b>morning Blue Star ferry to Naxos</b> (currently 7:25 am, about five hours; check the timetable for your date). Buy numbered indoor seats and bring breakfast from a bakery. The ship has cafes, open decks, and room to walk, and everyone can nap. Tip: leave the big suitcases with the Athens hotel you will use on the last night, and take carry-on-size bags to the islands.",
      "By the afternoon everyone is on the sand at <b>Agios Georgios (St. George) beach</b>, a shallow, family-friendly bay a level 10-minute walk from the port and Naxos Town.",
      "<b>Sunset at the Portara</b>, the great marble doorway of an unfinished temple of Apollo from about 530 BC, standing alone on its islet above the harbor. It is free. Dinner on the waterfront."],
      mom: "The causeway to the Portara is flat but exposed, and the last stretch up to the gate has steps. The view from the waterfront is just as good." + (d.flyToNaxos ? "" : " If the early ferry is too much for her, flying takes 40 minutes and " + effectWords(delta("dial.flyToNaxos")) + " for the group.") });
    days.push({ n: 5, base: "Naxos", title: "Mountain villages and a long lunch", body: [
      (d.privateDrivers ? "A private minibus with a local driver, about seven hours at a gentle pace: the <b>Temple of Demeter</b> at Sangri, white marble from the 6th century BC in a quiet farming valley; <b>Halki</b>; <b>Apiranthos</b>; and on the way home the <b>Kouros of Flerio</b>, an unfinished marble giant about 2,600 years old, still lying where the sculptors left him."
        : d.rentalVan ? "Pick up the rental van and drive the island's quiet interior at your own pace: the <b>Temple of Demeter</b> at Sangri, white marble from the 6th century BC in a quiet farming valley; <b>Halki</b>; <b>Apiranthos</b>; and on the way home the <b>Kouros of Flerio</b>, an unfinished marble giant about 2,600 years old, still lying where the sculptors left him. Most vans are manual, automatics must be reserved months ahead, and the driver should carry an International Driving Permit from AAA (about $20)."
        : "Take the public bus to <b>Halki</b>, the old capital of the island's interior, for a few euros each: the Vallindras citron-liqueur distillery, Byzantine churches, and cafes under the trees. Anyone with energy rides on to <b>Apiranthos</b>, the marble-paved mountain village. Check the return timetable before you sit down to lunch. The Temple of Demeter and the Kouros of Flerio need a vehicle; the rental van option " + effectWords(delta("dial.rentalVan")) + "."),
      "Lunch at a village taverna. Back by 4:00 pm for the beach. Dinner in the lanes of the old town under the Venetian castle."],
      mom: "Village lanes have slopes and smooth marble paving, so one manageable village beats a full circuit. Halki is the flattest." });
    days.push({ n: 6, base: "Naxos", title: "A day of rest", body: [
      "Nothing scheduled. Beach, books, a swim. Anyone who wants a different beach can take the bus to Agios Prokopios or Plaka for about " + EUR + "2 each way.",
      d.cookingClass ? "Late afternoon: a <b>hands-on family cooking class and dinner</b> with a local family in one of the villages, about four hours, ending with the meal everyone cooked. Three generations around one long table."
        : "Evening: wander the Kastro, the Venetian castle quarter above the harbor, free and shaded by then. For a family dinner that costs very little, buy cheese, tomatoes, olives, bread, and local wine at the market and eat on the beach at sunset. Three generations on one blanket."] });
    if (skipS) {
      days.push({ n: 7, base: "Naxos", title: "The long beaches", body: ["Bus to <b>Agios Prokopios</b> or <b>Plaka</b>, long sandy beaches with clear, shallow water, about " + EUR + "2 each way. Lunch at a beach taverna, or a picnic from the bakery. Back for the evening stroll on the waterfront."],
        mom: "Pick a taverna with its own sunbeds and shade; many lend them free with lunch. The bus stops are on the road just behind the sand." });
      days.push({ n: 8, base: "Naxos", title: "The old town, and goodbye to Naxos", body: ["A slow morning in the <b>Kastro</b> and the old market lanes below it: Venetian mansions, tiny chapels, shops selling local cheese and citron liqueur. Afternoon at Agios Georgios beach, one more sunset at the Portara, a last island dinner, and pack."],
        mom: "The Kastro lanes climb gently, with steps in places. The lower market streets and the waterfront are flat." });
    } else {
      days.push({ n: 7, base: "Santorini", title: "By sea into the caldera", body: [
        "Late-morning <b>Blue Star ferry</b>, about two hours. Choose the big conventional ferry over the fast catamarans: it is steadier in the summer winds, it costs less, and it has open decks. Be on deck for the last 20 minutes as the ship sails into the flooded volcanic crater beneath cliffs nearly a thousand feet high. It is the most dramatic arrival in Greece, and it is included in the ticket.",
        "A prebooked minibus climbs the switchbacks from the port to the " + (s.apartments ? "apartments" : "hotel") + ". This is the one private transfer worth paying for: the port is chaotic and the public bus fills fast. Rest, then a late-afternoon bus or taxi to Firostefani and the <b>cliff path toward Fira</b>, a paved walkway along the rim with the postcard view the whole way. Sunset from a bench, or from a cafe table for the price of one drink."],
        mom: "Board the ferry early and ask the crew at the ramp about the elevator or escalator up to the lounges. The cliff path has some steps and slopes; a taxi can drop her at Firostefani, where the rim is closest to the road, and the view from a cafe chair is the same view." });
      days.push({ n: 8, base: "Santorini", title: d.sunsetCruise ? "Akrotiri, and the caldera from the water" : "Akrotiri and Oia", body: [
        (d.privateDrivers ? "A private minibus and driver for the day. " : "") + "Be at <b>Akrotiri</b> when it opens" + (d.privateDrivers ? "" : "; the bus from Fira takes about 20 minutes") + ". This is a Bronze Age town buried by the volcano around 1600 BC, often called the Minoan Pompeii: streets, multi-story houses, storage jars still in place. " + (d.guides ? "A licensed guide brings it to life." : "The signs are good; a guidebook chapter read the night before does the rest."),
        d.sunsetCruise ? "Lunch and a rest. At about 3:00 pm, the <b>shared sunset cruise</b>: Red Beach, White Beach, a swim near the hot springs, dinner on board, and sunset from the water below the cliffs. Confirm boarding access and the weather with the operator."
          : "Lunch and an afternoon rest. Evening: " + (d.privateDrivers ? "the driver takes everyone" : "the bus") + " to <b>Oia</b> for the sunset. Go two hours early, walk the marble main street, and watch from the western lanes. Skip the castle viewpoint; in summer it is shoulder to shoulder. This is the farewell to the islands."],
        mom: "Akrotiri is under a modern roof with level walkways, which makes it the easiest major site of the trip and the coolest place on the island at midday. Oia's main street is level marble, but it is crowded; a cafe table booked for sunset spares her the crush." });
    }
    if (d.ferryBack) days.push({ n: 9, base: "Athens", title: "The long way back to Athens", body: [
      skipS ? "The <b>Blue Star ferry from Naxos to Piraeus</b>, about five and a half hours, then two taxis to the Athens hotel. Take the morning sailing, so the evening is free for a last walk in Plaka and a farewell dinner under the lit Acropolis."
        : "The <b>Blue Star ferry to Piraeus</b>. The big ship takes seven to eight hours and the last sailing of the day currently leaves around 3:30 pm, so expect to reach the Athens hotel close to midnight. Dinner is on board. The fast boats take four to five hours, but they cost about as much as flying and are the first to be canceled in the summer winds.",
      "This " + effectWords(delta("dial.ferryBack")) + " for the family, and it spends the buffer day on the water: if the ferry is late or canceled, there is little room before the flight home."],
      mom: "This is the longest travel day in Greece, the day before the longest flight. Book numbered indoor seats so she can rest. If it sounds like too much, flying takes 45 minutes." });
    else days.push({ n: 9, base: "Athens", title: "A last night under the Acropolis", body: [
      "Morning flight from " + (skipS ? "Naxos" : "Santorini") + " to Athens, about 45 minutes, booked months ahead while fares are low, and two taxis to the hotel. Afternoon: rest, window-shopping in Plaka, or the National Archaeological Museum for the gold Mask of Agamemnon and the Antikythera Mechanism (its ticket is not in the budget).",
      "<b>Farewell dinner</b> at a neighborhood taverna, with the Acropolis lit above the rooftops. The mainland night is the buffer: the flight home never depends on a same-day island connection."] });
    days.push({ n: 10, base: "Athens", title: "Home together", body: [
      "Two taxis to the airport three hours before departure. All seven take the same nonstop to O'Hare, which leaves around midday and lands the same afternoon. Mom, Jennifer, Avery, and Ryder are home. Matthew, Chris, and his friend clear passport control, re-check their bags, and continue to the Bay Area that evening; allow at least three to four hours for that connection."] });
    return days;
  }
  function tripHTML(s) {
    var trip = parseISO(s.tripDate), skipS = s.dials.skipSantorini, h = "", mo = addDays(trip, 1).getMonth();
    var season = mo === 6 ? "July is the hottest and busiest month of the Greek year" : mo === 5 ? "June in Greece is already hot, if a little cooler and quieter than July" : mo === 7 ? "August is as hot as July and even busier" : "Greece can be hot from May well into September";
    h += '<h2 class="sec first">Nine nights in Greece</h2><p class="lead">' + (skipS ? "Athens for three nights, Naxos for five, and a last night in Athens." : "Athens for three nights, Naxos for three, Santorini for two, and a last night in Athens.") +
      " Leave O'Hare on <strong>" + esc(fmtWeekday(trip)) + "</strong>, land in Athens the next morning, and fly home on <strong>" + esc(fmtWeekday(addDays(trip, 10))) + "</strong>. " +
      (mo === 5 ? "June runs cooler, quieter, and cheaper than July, and the earlier in the month, the more that is true." : mo === 6 ? "The first half of July is better than the second, which is hotter, busier, and more expensive. June is better still." : mo === 7 ? "August is the most crowded and expensive month in the islands; June would cost less and be kinder to Mom." : "Outside June to August the islands are quieter and cheaper, the sea is cooler, and some ferries and the Chicago nonstop may not be running, so check both before booking.") + "</p>";
    h += '<h2 class="sec">Built around Mom</h2><p>Mom will be almost 79, and ' + season + ". The Acropolis has closed during the midday hours on heat wave days in recent summers, in June as well as July. The plan treats that as a design rule.</p>" + ul([
      "<b>Sites at opening time, siesta, long evenings.</b> Outdoor sites happen first thing in the morning. Afternoons from about 1:00 to 5:00 are for rest and shade. Evenings are for strolling and unhurried dinners, the way Greeks do it.",
      "<b>Big day, easy day.</b> Each demanding day is followed by a gentle one.",
      "<b>History first, islands second.</b> The heavy sightseeing happens while everyone is fresh. Then the Cyclades, where the sea breeze usually keeps afternoons in the 80s.",
      "<b>Steps are counted.</b> Lodging is chosen for a ground floor or an elevator. Nothing is guaranteed to suit her, so confirm elevators, steps, showers, and air conditioning directly before paying.",
      "<b>A buffer before the flight home.</b> The last night is in Athens, so the flight home never depends on a same-day island connection."]);
    h += '<h2 class="sec">Getting there together</h2><p>Four travelers live in Chicago and three in the San Francisco Bay Area. The best plan puts all seven on the same plane for the long flight, and that plane leaves from Chicago.</p>' + ul([
      "<b>One nonstop for everyone.</b> United and American have each flown Chicago O'Hare to Athens nonstop every day in summer. It takes about 10 hours 20 minutes, leaving O'Hare in the afternoon and landing in Athens the next morning. The flight home leaves Athens around midday and lands in Chicago the same afternoon. Mom never changes planes. Confirm the route, the times, and seven seats when the schedule opens.",
      "<b>The Bay Area three join in Chicago.</b> There is no nonstop from San Francisco to Athens, so they need one connection anyway. Book " + esc(s.bayAirport || "SFO") + " to O'Hare to Athens as one through ticket on the same airline, so the fare includes the domestic legs and the airline owns the connection. " + ((s.bayAirport || "SFO") === "OAK" ? "Oakland is selected. When this was researched, neither United nor American appeared to fly Oakland to O'Hare, so confirm that a full Oakland itinerary exists and prices as well as one from SFO before relying on it." : "Use SFO unless a full Oakland itinerary prices and connects as well.") + "",
      s.chicagoNight ? "<b>The day before.</b> The Bay Area three fly to Chicago on " + esc(fmtWeekday(addDays(trip, -1))) + ". The budget includes two rooms, meals, and local rides. Set the room rate to zero if family can host."
        : "<b>Same-day connection.</b> Take the first flight of the morning, with at least four to five hours at O'Hare. Each airline flies the nonstop once a day, so a missed connection would split the group. Flying in the evening before and staying with family removes that risk; the Chicago overnight can be switched on under Adjust the plan.",
      "<b>Booking.</b> Ask the airline to price the four Chicago travelers and the three Bay Area travelers on the same international flights. Large bookings sometimes price higher, so compare one reservation against four plus three. Separate reservations can be linked so the airline keeps the group together, but linking does not make them one protected itinerary. Request wheelchair assistance for Mom at both airports.",
      "<b>If the nonstop is not offered that year.</b> It is a seasonal route and the schedule does not exist yet. The fallback is to meet at Newark or Washington Dulles, which have both had United summer nonstops to Athens in recent years.",
      "<b>Miles.</b> Pick United or American now and put everyday spending and flights toward it. Treat any free ticket as a bonus, not as part of the budget."]);
    h += '<h2 class="sec">Day by day</h2>';
    var blurb = { Athens: "Stay in Koukaki, Makrygianni, or Plaka, the flat, walkable neighborhoods at the foot of the Acropolis.",
      Naxos: "The largest and greenest of the Cyclades: long sandy beaches with shallow water, marble villages in the mountains, a Venetian castle town, and prices well below Santorini.",
      Santorini: "The most beautiful place in Greece, and crowded and expensive all summer. Two nights are enough for the arrival by sea, two sunsets, Akrotiri, and Oia. The plan sleeps away from the cliff edge, where rooms cost about a third as much, and treats the caldera as a free view." };
    var last = "", seen = {};
    itinerary(s).forEach(function (x) {
      if (x.base !== last) { h += '<div class="base"><h3>' + esc(x.base) + (x.n >= 9 ? " and home" : "") + "</h3>" + (seen[x.base] ? "" : "<p>" + blurb[x.base] + "</p>") + "</div>"; last = x.base; seen[x.base] = 1; }
      h += '<details class="day"' + (openDays[x.n] ? " open" : "") + ' data-day="' + x.n + '"><summary><span class="n"><b>Day ' + x.n + "</b>" + esc(fmtWeekday(addDays(trip, x.n))) + '</span><span class="t">' + esc(x.title) + '</span><span class="chev"></span></summary><div class="body">' +
        x.body.filter(Boolean).map(function (p) { return "<p>" + p + "</p>"; }).join("") + (x.mom ? '<p class="mom"><b>For Mom.</b> ' + x.mom + "</p>" : "") + "</div></details>";
    });
    h += '<h2 class="sec">Where to stay</h2><p>' + (s.apartments ? "The budget prices apartments by the bedroom, at about 65% of the hotel room rates below plus cleaning fees, whether that turns out to be two apartments or one larger one. The single last night in Athens is in hotel rooms, because one-night apartment stays are rarely offered. These are budget assumptions, not listings. Confirm the legal occupancy and the actual beds, especially three real beds for Jennifer, Avery, and Ryder."
      : "Booking calendars open about a year ahead, so these are what to look for and what the budget assumes, not reservations.") + "</p>" + ul([
      "<b>Athens.</b> Koukaki, Makrygianni, or Plaka. Must-haves: an elevator or a ground floor, strong air conditioning, and a street a taxi can reach. The budget assumes " + eur(num(s.hotelAthens, 130)) + " a room a night.",
      "<b>Naxos.</b> Agios Georgios beach, at the edge of Naxos Town, gives Mom a level walk to the sand, the port, and the old town. Family-run studios and apartments with kitchens are common. The budget assumes " + eur(num(s.hotelNaxos, 120)) + ".",
      skipS ? "" : "<b>Santorini.</b> Sleep away from the caldera. Karterados and the back streets of Fira are a short bus or taxi ride from the cliff path. Kamari and Perissa, the black-sand beach villages, have the lowest prices and frequent buses. Places there are usually at ground level or one floor up, which suits Mom far better than cliffside hotels built down staircases. The budget assumes " + eur(num(s.hotelSantorini, 150)) + ", which is an estimate.",

  function saveShared(next, doneMsg, errEl, isRetry) {
    if (saving && !isRetry) return Promise.resolve(false);
    if (editorMode) {
      if (staleTab()) { if (errEl) errEl.textContent = STALE_MSG; else toast(STALE_MSG, true); renderMain(); return Promise.resolve(false); }
      if(!lsGet('gwm.base'))lsSet('gwm.base',publishedSnapshot);
      if(!lsGet('gwm.baseState'))lsSet('gwm.baseState',JSON.parse(publishedSnapshot));
      next.rev = (state.rev || 0) + 1; next.updated = new Date().toISOString();
      if (!lsSet("gwm.local", next)) { var m0 = "This browser would not store the change. Check that private browsing is off."; if (errEl) errEl.textContent = m0; else toast(m0); return Promise.resolve(false); }
      if (draft && JSON.stringify(next.settings) === JSON.stringify(draft)) draft = null;   /* only a saved plan clears the draft */
      state = next;
      ["dlg-pay", "dlg-plan", "dlg-spend"].forEach(function (id) { var d = document.getElementById(id); if (d) closeDialog(d); });
      renderMain(); toast(doneMsg + " Publish when you are ready.");
      return Promise.resolve(true);
    }
    if (!artifactNs) { if (errEl) errEl.textContent = "Saving is not available in this view."; return Promise.resolve(false); }
    saving = true; document.body.classList.add("saving");
    next.rev = (state.rev || 0) + 1; next.updated = new Date().toISOString();
    var html = buildDocument(next, $("#app-css").textContent, $("#app-js").textContent);
    stash("gwm.toast", doneMsg); stash("gwm.tab", tab);
    return artifactNs.publish(html).then(function () {
      saving = false; document.body.classList.remove("saving");
      if (draft && JSON.stringify(next.settings) === JSON.stringify(draft)) draft = null;   /* only a saved plan clears the draft */
      state = next;
      ["dlg-pay", "dlg-plan", "dlg-spend"].forEach(function (id) { var d = document.getElementById(id); if (d) closeDialog(d); });
      renderMain(); toast(doneMsg);
      return true;
    }, function (e) {
      var code = (e && e.code) || "upstream_error";
      stash("gwm.toast", null);
      if (code === "upstream_error" && !isRetry) {
        return new Promise(function (res) { setTimeout(res, 900 + Math.random() * 900); }).then(function () { return saveShared(next, doneMsg, errEl, true); });
      }
      saving = false; document.body.classList.remove("saving");
      var msg = "That did not save. Check your connection and try again.";
      if (code === "conflict") { msg = "Someone saved a change a moment ago. The page is refreshing; enter this again afterward."; stash("gwm.toast", "A newer version loaded. Your last change was not saved, so enter it again."); }
      else if (code === "rate_limited") msg = "Saving too often. Wait a minute, then try again.";
      else if (code === "too_large" || code === "invalid_content" || code === "transform_error") msg = "The page could not be saved in this form. Ask Claude to take a look.";
      else if (code !== "upstream_error") { canSave = false; msg = "This view is read only. Only Chris can save changes."; renderMain(); }
      if (errEl) errEl.textContent = msg; else toast(msg);
      return false;
    });
  }

  function renderGh() {
    var g=ghConfig(),d=dialog('dlg-gh');
    d.innerHTML='<div class="sheet"><h2>Publish settings</h2><p class="sub">Use a fine-grained GitHub token restricted to this repository with Contents read/write permission. The token is kept for this browser tab’s session and is never included in the downloaded page. Publishing makes the trip dates and contribution ledger public on a public site.</p><div class="grid2"><label class="field"><span>GitHub owner</span><input type="text" id="gh-owner" value="'+esc(g.owner)+'"></label><label class="field"><span>Repository</span><input type="text" id="gh-repo" value="'+esc(g.repo)+'"></label><label class="field"><span>Branch</span><input type="text" id="gh-branch" value="'+esc(g.branch)+'"></label><label class="field"><span>File path</span><input type="text" id="gh-path" value="'+esc(g.path)+'"></label></div><label class="field"><span>Access token</span><input type="password" id="gh-token" value="'+esc(g.token)+'" autocomplete="off" placeholder="github_pat_..."></label><p class="hint">#editor enables local editing. Your GitHub credential controls publishing. It does not make the public page private.</p><div class="sheetbar"><button class="btn primary" data-act="gh-save">Save settings</button><button class="btn" data-act="gh-close">Cancel</button></div></div>';
    openDialog(d);
  }

  /* ---------- music: off until someone asks for it; the choice is remembered on this device ---------- */
  var music = null, musicOn = false, armed = false;
  var NOTE = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>';
  function musicButton() {
    return '<button class="musicfab' + (musicOn ? " on" : "") + '" data-act="music" aria-pressed="' + (musicOn ? "true" : "false") + '" aria-label="' + (musicOn ? "Turn the music off" : "Turn the music on") + '" title="' + (musicOn ? "Music is on" : "Music is off") + '">' + NOTE + (musicOn ? "" : '<path d="M3 3l18 18"/>') + "</svg></button>";
  }
  function paintMusic() { Array.prototype.forEach.call(document.querySelectorAll('[data-act="music"]'), function (b) { b.outerHTML = musicButton(); }); }
  function setMusic(on, remember) {
    if (on) {
      if (!music) {
        music = document.createElement("audio"); music.src = "music.mp3"; music.loop = true; music.preload = "auto"; music.volume = 0.6;
        music.addEventListener("error", function () { musicOn = false; paintMusic(); toast("The music file is missing. Put music.mp3 in the same folder as this page."); });
        document.body.appendChild(music);
      }
      musicOn = true; if (remember) lsSet("gwm.music", true); paintMusic();
      var p = music.play();
      if (p && p.catch) p.catch(function (e) {
        if (e && e.name === "NotAllowedError") { /* the browser wants a tap first */
          musicOn = false; paintMusic();
          var evs = ["click", "touchend", "keydown"], go = function (ev) {
            if (ev && ev.target && ev.target.closest && ev.target.closest('[data-act="music"]')) return;   /* a tap on the music button is handled by the button itself */
            evs.forEach(function (n) { document.removeEventListener(n, go, true); }); armed = false; if (lsGet("gwm.music") === true && !musicOn) setMusic(true, false); };
          if (armed) return; armed = true;
          evs.forEach(function (n) { document.addEventListener(n, go, true); });
        }
      });
    } else { if (music) music.pause(); musicOn = false; if (remember) lsSet("gwm.music", false); paintMusic(); }
  }
  var hiddenAt = 0;
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    var openSheet = document.querySelector("dialog[open]");
    if (hiddenAt && Date.now() - hiddenAt > 30 * 60 * 1000 && !editorMode && !dirty() && !openSheet && location.protocol !== "file:") location.reload();
  });
  document.addEventListener("visibilitychange", function () {
    if (!music || !musicOn) return;
    if (document.hidden) { music.pause(); return; }
    var p = music.play(); if (p && p.catch) p.catch(function () { musicOn = false; paintMusic(); });   /* the browser refused: show the truth; the next tap on the button starts it again */
  });

  /* ---------- events ---------- */
  document.addEventListener("click", function (ev) {
    var b = ev.target.closest && ev.target.closest("[data-act]"); if (!b) return;
    var act = b.getAttribute("data-act"), next;
    if(saving)return;
    if (act === "tab") { tab = b.getAttribute("data-tab"); try { history.replaceState(null, "", "#" + tab + (editorMode ? "&editor" : "")); } catch (e) {} renderMain(); window.scrollTo(0, 0); }
    else if (act === "music") setMusic(!musicOn, true);
    else if (act === "reload-tab") location.reload();
    else if (act === "download-page") downloadPage();
    else if (act === "stranded-download" || act === "stranded-drop") {
      var sid = b.getAttribute("data-id"), item = strandedList.filter(function (x) { return x.id === sid; })[0]; if (!item) return;
      if (act === "stranded-download") { var sa = document.createElement("a"); sa.href = URL.createObjectURL(new Blob([buildDocument(normalize(item.state), $("#app-css").textContent, $("#app-js").textContent)], { type: "text/html" })); sa.download = "unpublished-draft-" + item.at.slice(0, 10) + ".html"; document.body.appendChild(sa); sa.click(); setTimeout(function () { URL.revokeObjectURL(sa.href); sa.remove(); }, 2000); }
      else { if (b.getAttribute("data-armed") !== "1") { b.setAttribute("data-armed", "1"); b.textContent = "Tap again to discard"; return; } var latest = storedStranded(); strandedList.forEach(function (x) { if (!latest.some(function (y) { return y.id === x.id; })) latest.push(x); });
        latest = latest.filter(function (x) { return x.id !== sid; }); lsSet("gwm.strandedList", latest.length ? latest : null); strandedList = latest; renderMain(); }
    }
    else if (act === "gh-publish") ghPublish();
    else if (act === "open-gh") renderGh();
    else if (act === "gh-close") closeDialog(dialog("dlg-gh"));
    else if(act==='gh-save'){
      var cfg={owner:$('#gh-owner').value.trim(),repo:$('#gh-repo').value.trim(),branch:$('#gh-branch').value.trim(),path:$('#gh-path').value.trim().replace(/^\/+/,'')};
      if(!cfg.owner||!cfg.repo||!cfg.branch||!cfg.path){toast('Complete every repository field.');return;}
      var ok=lsSet('gwm.gh',cfg);try{sessionStorage.setItem(storagePrefix+'token',$('#gh-token').value.trim());}catch(e){ok=false;}
      if(!ok){toast('This browser could not retain the settings. Use Download the page.');return;}
      closeDialog(dialog('dlg-gh'));renderMain();toast('Settings saved. The token lasts for this browser tab’s session.');
    }
    else if (act === "open-plan") renderPlan();
    else if (act === "close-plan") { closeDialog(dialog("dlg-plan")); renderMain(); }
    else if (act === "discard") { draft = null; closeDialog(dialog("dlg-plan")); renderMain(); }
    else if (act === "defaults") { var keep = ensureDraft(); draft = clone(DEFAULT_STATE.settings); draft.extras=clone(keep.extras); draft.purchases.forEach(function (p, i) { p.bought = keep.purchases[i] ? keep.purchases[i].bought : false; }); renderPlan(); renderMain(); }
    else if (act === "add-extra") { var s = ensureDraft(); s.extras.push({ id: uid(), name: "", date: toISO(addMonths(parseISO(s.tripDate), -2)), amount: 0, split: "perTraveler", bought: false }); renderPlan(); renderMain(); }
    else if (act === "remove-extra") { var ex=ensureDraft().extras[+b.getAttribute("data-i")]; if((state.spending||[]).some(function(x){return x.purchaseId===ex.id;})){toast("This purchase has spending records. Keep it and adjust its amount instead.");return;} ensureDraft().extras.splice(+b.getAttribute("data-i"), 1); renderPlan(); renderMain(); }
    else if (act === "save-plan") { if (!draft) return; var issue=validatePlanInputs()||settingsError(draft); if(issue){document.getElementById("plan-err").textContent=issue;return;} next = clone(state); next.settings = clone(draft); saveShared(next, "Plan saved in this browser.", document.getElementById("plan-err")); }
    else if(act==='open-spend')renderSpend();
    else if(act==='close-spend')closeDialog(dialog('dlg-spend'));
    else if(act==='save-spend')saveSpend();
    else if(act==='remove-spend'){
      if(!canSave)return;
      if(b.getAttribute('data-armed')!=='1'){b.setAttribute('data-armed','1');b.textContent='Tap again to remove';setTimeout(function(){if(b.isConnected){b.removeAttribute('data-armed');b.textContent='Remove';}},3500);return;}
      next=clone(state);next.spending=next.spending.filter(function(x){return x.id!==b.getAttribute('data-id');});saveShared(next,'Expense removed.');
    }
    else if (act === "open-pay") renderPay();
    else if (act === "close-pay") closeDialog(dialog("dlg-pay"));
    else if (act === "fill") { var inp = document.getElementById("pay-" + b.getAttribute("data-who")); inp.value = b.getAttribute("data-amt"); inp.focus(); }
    else if (act === "save-pay") {
      if(!canSave)return;
      var date = $("#pay-date").value, note = $("#pay-note").value.trim(), added = [], err = $("#pay-err");
      if (!date) { err.textContent = "Pick the date the money was received."; return; }
      if(!validISO(date) || date>toISO(today())){err.textContent='Record a date on or before today. Future deposits are plans, not money received.';return;}
      var invalid=false;
      PAYERS.forEach(function(p){var raw=$('[data-pay="'+p+'"]').value.trim();if(!raw)return;var v=numericInput(raw);if(!isFinite(v)||v<=0){invalid=true;return;}added.push({id:uid(),who:p,amount:cents(v),date:date,note:note});});
      if(invalid){err.textContent='Enter a positive amount with no more than two decimal places, or leave the box empty.';return;}
      if (!added.length) { err.textContent = "Enter an amount for at least one person."; return; }
      var owedNow = derive(state.settings, state.payments, today(), state.spending).payers, tooBig = added.filter(function (a) { var q = owedNow.filter(function (x) { return x.id === a.who; })[0]; return q && a.amount > Math.max(0, q.goal - q.saved) + 0.005; });
      var bigKey = tooBig.map(function (a) { return a.who + ":" + a.amount; }).join("|");      /* a slip of the finger, such as 3900 for 390, asks for a second tap */
      if (tooBig.length && b.getAttribute("data-confirmed") !== bigKey) { b.setAttribute("data-confirmed", bigKey); err.textContent = "That is more than " + tooBig.map(function (a) { return a.who; }).join(" and ") + (tooBig.length === 1 ? " still owes" : " still owe") + " for the whole trip. Check the amount. To record it anyway, tap Save payments again."; return; }
      next = clone(state); next.payments = next.payments.concat(added);
      saveShared(next, "Recorded " + added.map(function (a) { return moneyExact(a.amount) + " from " + a.who; }).join(", ") + ".", err);
    }
    else if (act === "remove-pay") {
      if (b.getAttribute("data-armed") !== "1") { b.setAttribute("data-armed", "1"); b.textContent = "Tap again to remove"; setTimeout(function () { if (b.isConnected) { b.removeAttribute("data-armed"); b.textContent = "Remove"; } }, 3500); return; }
      next = clone(state); next.payments = next.payments.filter(function (p) { return p.id !== b.getAttribute("data-id"); });
      saveShared(next, "Payment removed.");
    }
    else if (act === "toggle-all") { showAll = !showAll; renderMain(); }
  });
  function onEdit(ev) {
    var el = ev.target, d = document.getElementById("dlg-plan"); if (!d || !d.contains(el)) return;
    var s = ensureDraft(), key = el.getAttribute("data-set"), k = el.getAttribute("data-k"), rerender = false;
    if (key) {
      if (key === "insurance" || key === "bayAirport") s[key] = el.value;
      else if (key.indexOf("dial.") === 0) s.dials[key.slice(5)] = el.checked;
      else if (el.type === "checkbox") s[key] = el.checked;
      else if (key === "tripDate") { el.setAttribute("aria-invalid", el.value ? "false" : "true"); if (!el.value || ev.type !== "change") return; shiftDates(s, s.tripDate, el.value); s.tripDate = el.value; rerender = true; }
      else if (key === "startDate") { el.setAttribute("aria-invalid", el.value ? "false" : "true"); if (!el.value) return; s.startDate = el.value; }
      else if (key === "finishBy") { s.finishBy = el.value && el.value !== toISO(autoLast(s)) ? el.value : null; if (!el.value && ev.type === "change") rerender = true; }
      else { var v=configNumber(el.value);if(!isFinite(v)||v<0||(key==="fx"&&v<=0)){el.setAttribute("aria-invalid","true");document.getElementById("plan-err").textContent="Enter a valid number; the exchange rate must be positive.";return;}el.setAttribute("aria-invalid","false");document.getElementById("plan-err").textContent="";s[key]=v; }
    } else if (k) {
      var row = el.hasAttribute("data-buy") ? s.purchases[+el.getAttribute("data-buy")] : s.extras[+el.getAttribute("data-extra")]; if (!row) return;
      if (k === "bought") row.bought = el.checked;
      else if(k==="amount"){var amount=el.value.trim()===""?0:numericInput(el.value);if(!isFinite(amount)){document.getElementById("plan-err").textContent="Enter a valid purchase amount with at most two decimals.";return;}row.amount=amount;}
      else if (k === "date") { el.setAttribute("aria-invalid", el.value ? "false" : "true"); if (!el.value) return; row.date = el.value; }
      else row[k] = el.value;
    } else return;
    if (rerender) renderPlan(); else refreshPlan();
    renderMain();
  }
  document.addEventListener("change", function (ev) {
    var id = ev.target.getAttribute && ev.target.getAttribute("data-todo"); if (!id) return;
    if (!canSave) { ev.target.checked = !ev.target.checked; return; }
    var next = clone(state); if (ev.target.checked) next.todo[id] = true; else delete next.todo[id];
    saveShared(next, ev.target.checked ? "Marked done in this browser." : "Marked not done.").then(function (ok) { if (!ok) renderMain(); });
  });
  document.addEventListener("toggle", function (ev) { var n = ev.target.getAttribute && ev.target.getAttribute("data-day"); if (n) openDays[n] = ev.target.open; }, true);
  document.addEventListener("input", onEdit);
  document.addEventListener("change", onEdit);
  document.addEventListener("keydown", function (ev) { if (ev.key === "Enter" && ev.target.closest && ev.target.closest("#dlg-pay") && ev.target.tagName === "INPUT") { ev.preventDefault(); $('[data-act="save-pay"]').click(); } });
  window.addEventListener("hashchange", function () { readTab(); renderMain(); });
  if (editorMode) {
    var wasStale = false, recheck = function () {
      var now = staleTab(), stored = storedStranded(), ids = function (l) { return l.map(function (x) { return x.id; }).sort().join(","); }, listChanged = ids(stored) !== ids(strandedList);
      if (listChanged) strandedList = stored;
      if ((now !== wasStale || listChanged) && !document.querySelector("dialog[open]")) { wasStale = now; renderMain(); }
    };
    window.addEventListener("storage", recheck); window.addEventListener("focus", recheck); document.addEventListener("visibilitychange", function () { if (!document.hidden) recheck(); });
  }

  /* ---------- start ---------- */
  readTab();
  renderMain();
  if (lsGet("gwm.music") === true) setMusic(true, false);
  try {
    var waiting = JSON.parse(sessionStorage.getItem("gwm.toast") || "null"); sessionStorage.removeItem("gwm.toast");
    if (waiting && Date.now() - waiting.t < 20000) toast(waiting.m);
  } catch (e) {}

  var use = window.claude && typeof window.claude.use === "function" ? function (n) { return window.claude.use(n); } : null;
  if (use) {
    Promise.all([use("artifact"), use("user")]).then(function (r) {
      artifactNs = r[0]; if (!artifactNs) return;
      return (r[1] && r[1].canEdit ? r[1].canEdit() : Promise.resolve(true)).then(function (ok) {
        canSave = !!ok; if (!canSave) return;
        renderMain(); var d = document.getElementById("dlg-plan"); if (d && d.open) renderPlan();
      });
    }).catch(function () {});
  }
})();
</script>
